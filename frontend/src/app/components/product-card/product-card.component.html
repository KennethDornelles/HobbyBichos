<div class="product-card bg-white rounded-xl shadow-sm hover:shadow-lg transition-all duration-300 overflow-hidden group">
  <!-- Product Image -->
  <div class="relative overflow-hidden">
    <a [routerLink]="['/product', product.id]" class="block">
      <img 
        [src]="primaryImage" 
        [alt]="product.name"
        class="w-full h-64 object-cover group-hover:scale-105 transition-transform duration-300"
        loading="lazy"
      >
    </a>
    
    <!-- Badges -->
    <div class="absolute top-3 left-3 flex flex-col gap-2">
      <span 
        *ngIf="isOnSale" 
        class="bg-red-500 text-white px-2 py-1 rounded-full text-xs font-semibold"
      >
        -{{ discountPercentage }}%
      </span>
      <span 
        *ngIf="product.isFeatured" 
        class="bg-primary-yellow text-white px-2 py-1 rounded-full text-xs font-semibold"
      >
        Destaque
      </span>
    </div>

    <!-- Stock Status -->
    <div 
      *ngIf="!isInStock" 
      class="absolute inset-0 bg-black bg-opacity-50 flex items-center justify-center"
    >
      <span class="text-white font-semibold text-lg">Esgotado</span>
    </div>
  </div>

  <!-- Product Info -->
  <div class="p-4">
    <!-- Category -->
    <div class="text-xs text-gray-500 mb-1" *ngIf="product.category">
      {{ product.category.name }}
    </div>

    <!-- Product Name -->
    <h3 class="font-semibold text-gray-800 mb-2 line-clamp-2 h-12">
      <a [routerLink]="['/product', product.id]" class="hover:text-primary-yellow transition-colors">
        {{ product.name }}
      </a>
    </h3>

    <!-- Price -->
    <div class="flex items-center justify-between mb-3">
      <div class="flex items-center gap-2">
        <span class="text-lg font-bold text-primary-yellow">
          {{ currentPrice | currency:'BRL':'symbol':'1.2-2' }}
        </span>
        <span 
          *ngIf="isOnSale" 
          class="text-sm text-gray-400 line-through"
        >
          {{ product.price | currency:'BRL':'symbol':'1.2-2' }}
        </span>
      </div>
    </div>

    <!-- Stock Info -->
    <div 
      class="text-xs mb-3"
      [class.text-red-500]="!isInStock"
      [class.text-orange-500]="product.stock <= 5 && product.stock > 0"
      [class.text-green-500]="product.stock > 5"
    >
      {{ stockStatus }}
    </div>

    <!-- Brand -->
    <div class="text-xs text-gray-500 mb-3" *ngIf="product.brand">
      Marca: {{ product.brand }}
    </div>

    <!-- Add to Cart Button -->
    <button
      *ngIf="showAddToCart && isInStock"
      (click)="addToCart()"
      class="w-full bg-primary-yellow hover:bg-yellow-500 text-white font-semibold py-2 px-4 rounded-lg transition-colors duration-200 flex items-center justify-center gap-2"
    >
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4m0 0L7 13m0 0l-2.5 2.5M7 13l2.5 2.5M21 21v-2a2 2 0 00-2-2H9a2 2 0 00-2 2v2"/>
      </svg>
      Adicionar ao Carrinho
    </button>

    <!-- Out of Stock Button -->
    <button
      *ngIf="showAddToCart && !isInStock"
      disabled
      class="w-full bg-gray-300 text-gray-500 font-semibold py-2 px-4 rounded-lg cursor-not-allowed"
    >
      Produto Esgotado
    </button>

    <!-- View Details Button -->
    <a
      [routerLink]="['/product', product.id]"
      class="block w-full text-center bg-gray-100 hover:bg-gray-200 text-gray-700 font-semibold py-2 px-4 rounded-lg transition-colors duration-200 mt-2"
    >
      Ver Detalhes
    </a>
  </div>
</div>
